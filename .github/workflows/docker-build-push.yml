name: Build & Push Docker Images

on:
  push:
    branches: [master, develop]
    paths:
      - 'demo/app-springboot/**'
      - 'demo/service-springboot-rest/**'
      - 'demo/keycloak-angular/**'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-app-springboot:
    name: app-springboot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        working-directory: demo/app-springboot
        run: mvn -B package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: demo/app-springboot
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/app-springboot:latest

  build-service-springboot:
    name: service-springboot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        working-directory: demo/service-springboot-rest
        run: mvn -B package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: demo/service-springboot-rest
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/service-springboot:latest

  build-keycloak-angular:
    name: keycloak-angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: demo/keycloak-angular
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/keycloak-angular:latest
